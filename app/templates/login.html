{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <form method="post" action="/login" class="lw-caixa">
      <h3 class="mb-3">Entrar</h3>
      <input type="hidden" name="proximo" value="{{ proximo or '' }}">
      <label>Email</label>
      <input class="form-control mb-2" type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
      <label>Password</label>
      <input class="form-control mb-3" type="password" name="password" required autocomplete="current-password">
      <button class="btn lw-btn btn-block">Entrar</button>
      <p class="mt-3 mb-0 small">Ainda não tens conta? <a href="/registo">Regista-te</a></p>
    </form>
  </div>
</div>
{% endblock %}
