{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <form method="post" action="/registo" class="lw-caixa">
      <h3 class="mb-3">Criar conta</h3>
      <label>Nome</label>
      <input class="form-control mb-2" type="text" name="nome" maxlength="100" value="{{ dados.nome if dados else '' }}" required>
      <label>Email</label>
      <input class="form-control mb-2" type="email" name="email" maxlength="255" value="{{ dados.email if dados else '' }}" required autocomplete="email">
      <label>Telefone <small class="text-muted">(opcional)</small></label>
      <input class="form-control mb-2" type="tel" name="telefone" maxlength="20" value="{{ (dados.telefone or '') if dados else '' }}">
      <label>Password <small class="text-muted">(mínimo 8 caracteres)</small></label>
      <input class="form-control mb-3" type="password" name="password" minlength="8" required autocomplete="new-password">
      <button class="btn lw-btn btn-block">Criar conta</button>
      <p class="mt-3 mb-0 small">Já tens conta? <a href="/login">Entra aqui</a></p>
    </form>
  </div>
</div>
{% endblock %}
